[workspace]
members = [
    "crates/nexus-protocol",
    "crates/nexus-private-file",
    "crates/nexus-core",
    "crates/nexus-agent",
    "crates/nexus-cli",
    "crates/nexus-launcher-core",
    "crates/nexus-launcher",
    "crates/nexus-snapshots",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.dependencies.tokio]
version = "1"
features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]
