[package]
name = "nexus-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nexus_agent"
path = "src/lib.rs"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.20.4", default-features = false, features = ["https", "vendored-libgit2"] }
axum.workspace = true
nexus-core = { path = "../nexus-core" }
nexus-launcher-core = { path = "../nexus-launcher-core" }
nexus-protocol = { path = "../nexus-protocol" }
nexus-snapshots = { path = "../nexus-snapshots" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
