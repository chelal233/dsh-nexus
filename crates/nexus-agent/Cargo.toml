[package]
name = "nexus-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nexus_agent"
path = "src/lib.rs"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"

[dependencies]
reqwest.workspace = true
nexus-private-file = { path = "../nexus-private-file" }
git2 = { version = "0.20.4", default-features = false, features = ["https", "vendored-libgit2"] }
axum.workspace = true
nexus-core = { path = "../nexus-core" }
nexus-launcher-core = { path = "../nexus-launcher-core" }
nexus-protocol = { path = "../nexus-protocol" }
nexus-snapshots = { path = "../nexus-snapshots" }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep the packaged Agent independent of the distribution's OpenSSL ABI.
git2 = { version = "0.20.4", default-features = false, features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation"] }
