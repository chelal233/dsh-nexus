[package]
name = "nexus-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nexus-launcher"
path = "src/main.rs"

[dependencies]
axum.workspace = true
hmac = "0.12"
nexus-core = { path = "../nexus-core" }
nexus-launcher-core = { path = "../nexus-launcher-core" }
nexus-protocol = { path = "../nexus-protocol" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tower-http.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Globalization"] }
