name: macOS original-package acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Published original candidate; this workflow never rebuilds release packages'
        type: string
        default: 'v1.0.4'
      baseline_tag:
        description: 'Published original previous-version package'
        type: string
        default: 'v1.0.3'
      full_business:
        description: 'Run actual original DMG/ZIP, version replacement and complete synthetic business acceptance'
        type: boolean
        default: false
      original_package_smoke:
        description: 'Separate original DMG/ZIP GUI and Agent smoke only; never full Web/session/migration acceptance'
        type: boolean
        default: false
      desktop_producer_only:
        description: 'Separate real rc.2 Desktop producer/session/plugin/start/restart subset; no Web or migration claim'
        type: boolean
        default: false
      temporary_limit_gib:
        description: 'Reviewed task temporary envelope; full business currently requires explicit 32 GiB approval'
        type: string
        default: '2'
      arm_free_gib:
        description: '0 preserves normal 20 GiB/10% floor; 8 requires an explicit ephemeral ARM QA exception'
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: macos-original-package-acceptance
  cancel-in-progress: false

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      QA_TEMP: ${{ github.workspace }}/.codex-temp/macos-acceptance
      QA_EVIDENCE: ${{ github.workspace }}/.codex-artifacts/macos-acceptance
      QA_ARCH: ${{ matrix.arch }}
      QA_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      QA_BASELINE_TAG: ${{ inputs.baseline_tag }}
      QA_TEMP_BUDGET_GIB: ${{ inputs.temporary_limit_gib }}
      QA_ARM_FREE_GIB: ${{ inputs.arm_free_gib }}
      QA_PACKAGE_SMOKE: ${{ inputs.original_package_smoke && '1' || '0' }}
      QA_DESKTOP_ONLY: ${{ inputs.desktop_producer_only && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify fail-closed acceptance contracts
        run: |
          count=0
          for selected in '${{ inputs.full_business }}' '${{ inputs.original_package_smoke }}' '${{ inputs.desktop_producer_only }}'; do
            if [ "$selected" = true ]; then count=$((count+1)); fi
          done
          test "$count" -le 1
          node --test .github/scripts/macos-acceptance-contract.test.mjs .github/scripts/migration-session-fixture.test.mjs .github/scripts/macos-acceptance-storage.test.mjs .github/scripts/macos-acceptance-browser.test.mjs
      - name: Read original identities, native GUI capability and capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/macos-acceptance-preflight.mjs
      - name: Accept intact published original packages within the requested scope
        if: inputs.full_business || inputs.original_package_smoke || inputs.desktop_producer_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/macos-original-package.mjs
      - name: Deliver bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-preflight-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ env.QA_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
