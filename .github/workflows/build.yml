name: Desktop build
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/nexus-launcher/**'
      - 'crates/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
      - '.github/scripts/check-source-privacy*'
      - '.github/scripts/check-git-redistribution*'
      - 'docs/**'
      - '*.md'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/nexus-launcher
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      NEXUS_BUILD_ID: electron-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      # This workflow produces acceptance artifacts, never signed release assets.
      NEXUS_UNSIGNED_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Linux native package and display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth rpm cpio libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libfuse2
      - name: Check source privacy
        run: |
          node --test ../../.github/scripts/check-source-privacy.test.mjs ../../.github/scripts/check-git-redistribution.test.mjs
          node ../../.github/scripts/check-source-privacy.mjs
      - name: Prepare native tools
        run: |
          npm install --global pnpm@11.7.0
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add "$CARGO_BUILD_TARGET"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)/" >> "$GITHUB_ENV"
          fi
      - name: Select native Windows test shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shell = (Get-Process -Id $PID).Path
          & $shell -NoLogo -NoProfile -NonInteractive -Command 'exit 0'
          if ($LASTEXITCODE -ne 0) { throw 'Test PowerShell failed its startup probe' }
          "NEXUS_TEST_POWERSHELL=$shell" >> $env:GITHUB_ENV
      - name: Locked dependencies and regression checks
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
          pnpm typecheck
          pnpm format:check
          pnpm test
          pnpm test:electron
          node --test ../../crates/nexus-agent/tests/*.test.mjs ../../plugins/nexus-desktop-bridge/health.test.mjs
          # Process-lifecycle fixtures fork and hold real OS locks; serialize
          # them to avoid inherited-descriptor windows and runner contention.
          cargo test --manifest-path ../../Cargo.toml --workspace --locked -j 2 -- --test-threads=1
      - name: Stage verified offline runtime
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Match a conservative glibc 2.28 floor, not the runner's newer libc.
            # Only compilation runs in the container; GUI acceptance uses the
            # ordinary non-root desktop runner with Chromium sandbox enabled.
            node_bin=$(dirname "$(command -v node)")
            docker run --rm --init -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$node_bin:$node_bin:ro" \
              -w "$GITHUB_WORKSPACE/apps/nexus-launcher" \
              -e CARGO_BUILD_TARGET -e NEXUS_BUILD_ID -e "NEXUS_BUILD_NODE_BIN=$node_bin" \
              quay.io/pypa/manylinux_2_28_aarch64 bash desktop/scripts/build-linux-agent.sh
          else
            pnpm prepare:agent
          fi
          pnpm prepare:runtime
          pnpm test:bundled-runtime
          pnpm prepare:desktop
          pnpm prepare:notices
          pnpm prepare:release
          pnpm verify:release
          node --test tests/*.test.mjs
          node --test ../../.github/scripts/verify-release-assets.test.mjs
      - name: Package Electron acceptance build
        run: |
          log=$(mktemp)
          if pnpm electron:build --${{ matrix.arch }} 2>&1 | tee "$log"; then
            exit 0
          fi
          # Finder/indexing can briefly hold the generated DMG's mounted volume.
          # Retry only this known transient error; never force-detach volumes.
          if [[ "$RUNNER_OS" == "macOS" ]] && grep -Fq 'Unable to detach device cleanly:' "$log" && grep -Fq 'Resource busy' "$log"; then
            sleep 10
            pnpm electron:build --${{ matrix.arch }}
          else
            exit 1
          fi
      - name: Windows installed package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'Nexus Electron Smoke'
          $setup = @(Get-ChildItem electron-dist -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList "/S /D=$install" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          node desktop/scripts/verify-installed.mjs "$install/resources"
          if ($LASTEXITCODE -ne 0) {
            $verificationExit = $LASTEXITCODE
            Get-ChildItem -LiteralPath "$install/resources" -ErrorAction Continue | Select-Object Name,Length,Attributes
            Get-ChildItem -Path 'electron-dist/win*-unpacked/resources/nexus-*.exe' -ErrorAction Continue | Select-Object FullName,Length
            try {
              Get-MpThreatDetection -ErrorAction Stop | Select-Object InitialDetectionTime,ThreatID,Resources,ActionSuccess | ConvertTo-Json -Depth 4
            } catch { Write-Host "Threat diagnostic unavailable: $($_.Exception.Message)" }
            exit $verificationExit
          }
          $env:NEXUS_SMOKE_EXECUTABLE = "$install/Nexus Launcher.exe"
          node scripts/electron-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows ZIP extracted package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem electron-dist -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one portable ZIP' }
          $portable = Join-Path $env:RUNNER_TEMP 'Nexus ZIP Smoke'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $portable
          node desktop/scripts/verify-installed.mjs "$portable/resources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NEXUS_SMOKE_EXECUTABLE = "$portable/Nexus Launcher.exe"
          node scripts/electron-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS installed package smoke
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/nexus-dmg"
          mkdir -p "$mount" "$RUNNER_TEMP/nexus-installed"
          images=(electron-dist/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          installed="$RUNNER_TEMP/nexus-installed/Nexus Launcher.app"
          ditto "$mount/Nexus Launcher.app" "$installed"
          node desktop/scripts/verify-installed.mjs "$installed/Contents/Resources"
          NEXUS_SMOKE_EXECUTABLE="$installed/Contents/MacOS/Nexus Launcher" node scripts/electron-smoke.mjs
      - name: Linux ARM64 package smoke
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          debs=(electron-dist/*.deb)
          rpms=(electron-dist/*.rpm)
          images=(electron-dist/*.AppImage)
          test "${#debs[@]}" -eq 1 && test "${#rpms[@]}" -eq 1 && test "${#images[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Architecture)" = arm64
          test "$(rpm -qp --qf '%{ARCH}' "${rpms[0]}")" = aarch64
          sudo dpkg -i "${debs[0]}"
          installed='/opt/Nexus Launcher'
          node desktop/scripts/verify-installed.mjs "$installed/resources"
          NEXUS_SMOKE_EXECUTABLE="$installed/nexus-launcher" xvfb-run -a node scripts/electron-smoke.mjs
          portable="$RUNNER_TEMP/nexus-rpm"
          mkdir -p "$portable"
          rpm2cpio "${rpms[0]}" | (cd "$portable" && cpio -id --quiet)
          node desktop/scripts/verify-installed.mjs "$portable$installed/resources"
          NEXUS_SMOKE_EXECUTABLE="$portable$installed/nexus-launcher" xvfb-run -a node scripts/electron-smoke.mjs
          APPIMAGE_EXTRACT_AND_RUN=1 NEXUS_SMOKE_EXECUTABLE="$(realpath "${images[0]}")" xvfb-run -a node scripts/electron-smoke.mjs
      - name: Collect verified packages
        env:
          NEXUS_PACKAGE_SMOKE_PASSED: '1'
        run: node desktop/scripts/collect-release.mjs
      - name: Check bundled Git redistribution clearance
        id: git-license
        run: node ../../.github/scripts/check-git-redistribution.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.git-license.outputs.cleared == 'true'
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  git-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Check Git material clearance
        id: git-license
        run: node .github/scripts/check-git-redistribution.mjs
      - name: Verify and package corresponding source
        if: steps.git-license.outputs.cleared == 'true'
        run: |
          node --test apps/nexus-launcher/tests/git-source-materials.test.mjs .github/scripts/verify-release-assets.test.mjs
          node apps/nexus-launcher/desktop/scripts/prepare-git-sources.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.git-license.outputs.cleared == 'true'
        with:
          name: release-git-sources
          path: target/git-source-assets/*
          if-no-files-found: error
          retention-days: 14
