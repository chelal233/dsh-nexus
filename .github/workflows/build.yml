name: Desktop build
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - runner: windows-2022
            target: i686-pc-windows-msvc
            bundles: nsis,msi
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-rtest
      NEXUS_BUILD_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Prepare tools
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # /var is a macOS symlink. Tests must use an ordinary data-root
            # ancestry so they exercise, rather than weaken, no-link guards.
            echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)/" >> "$GITHUB_ENV"
          fi
          npm install --global pnpm@11.7.0
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add "$CARGO_BUILD_TARGET"
      - name: Install locked frontend dependencies
        working-directory: apps/nexus-launcher
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v5
        id: cargo-cache
        with:
          path: target-rtest
          key: rust-1.98-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'apps/nexus-launcher/src-tauri/Cargo.lock') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: rust-1.98-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'apps/nexus-launcher/src-tauri/Cargo.lock') }}-
      - name: Frontend and platform regression tests
        working-directory: apps/nexus-launcher
        run: |
          pnpm typecheck
          pnpm test
          node --test tests/release-platform.test.mjs
      - name: Rust workspace tests (target architecture)
        run: cargo test --workspace --locked --target "$CARGO_BUILD_TARGET" -j 2 -- --test-threads=4
      - name: Compatibility checker regression tests
        run: node --test --test-concurrency=4 crates/nexus-agent/tests/compatibility.test.mjs
      - name: Stage native resources
        working-directory: apps/nexus-launcher
        run: |
          pnpm prepare:agent
          pnpm prepare:runtime
          pnpm test:bundled-runtime
          pnpm prepare:notices
          pnpm prepare:release
          node --test tests/prepare-agent.test.mjs tests/release-gate.test.mjs tests/release-manifest.test.mjs
      - name: Native bridge regression tests
        run: cargo test --manifest-path apps/nexus-launcher/src-tauri/Cargo.toml --locked --target "$CARGO_BUILD_TARGET" -j 2 -- --test-threads=4
      - name: Build installers
        working-directory: apps/nexus-launcher
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --target "$CARGO_BUILD_TARGET" --bundles "$BUNDLES" -- --locked
      - name: Windows installed package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET/release/bundle"
          $install = Join-Path $env:RUNNER_TEMP 'Nexus Package Smoke'
          $setup = @(Get-ChildItem -LiteralPath (Join-Path $bundle 'nsis') -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one NSIS installer' }
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList "/S /D=$install" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          node apps/nexus-launcher/src-tauri/scripts/verify-installed.mjs "$install" "$install/nexus-launcher-app.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath "$install/uninstall.exe" -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)" }
          if (Test-Path -LiteralPath "$install/nexus-launcher-app.exe") { throw 'Uninstall left the GUI binary behind' }
          if (Test-Path -LiteralPath (Join-Path $bundle 'msi')) {
            foreach ($msi in Get-ChildItem -LiteralPath (Join-Path $bundle 'msi') -Filter '*.msi') {
              $extract = Join-Path $env:RUNNER_TEMP $msi.BaseName
              $process = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extract`"" -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "MSI extraction exited $($process.ExitCode)" }
              $manifest = @(Get-ChildItem -LiteralPath $extract -Filter release-manifest.json -Recurse)
              if ($manifest.Count -ne 1) { throw 'Expected one packaged resource manifest' }
              node apps/nexus-launcher/src-tauri/scripts/verify-installed.mjs $manifest[0].DirectoryName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: macOS installed package smoke
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/nexus-dmg"
          mkdir -p "$mount" "$RUNNER_TEMP/nexus-installed"
          images=("$CARGO_TARGET_DIR/$CARGO_BUILD_TARGET/release/bundle/dmg/"*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount/"*.app)
          test "${#apps[@]}" -eq 1
          installed="$RUNNER_TEMP/nexus-installed/Nexus Launcher.app"
          ditto "${apps[0]}" "$installed"
          codesign --verify --deep --strict "$installed"
          node apps/nexus-launcher/src-tauri/scripts/verify-installed.mjs "$installed/Contents/Resources" "$installed/Contents/MacOS/nexus-launcher-app"
      - name: Verify resources and collect public artifacts
        working-directory: apps/nexus-launcher
        run: |
          pnpm verify:release
          node src-tauri/scripts/collect-release.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@v5
        if: always() && !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: target-rtest
          key: rust-1.98-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'apps/nexus-launcher/src-tauri/Cargo.lock') }}-${{ github.sha }}-${{ github.run_attempt }}
