name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check source privacy before reusing release artifacts
        run: |
          node --test .github/scripts/check-source-privacy.test.mjs
          node .github/scripts/check-source-privacy.mjs
      - name: Find a complete successful build of the tagged commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p "require('./apps/nexus-launcher/package.json').version")"
          sha=$(git rev-parse HEAD)
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$sha" --status success --limit 100 --json databaseId --jq '.[].databaseId')
          expected=$(node --input-type=module -e "import { targets } from './apps/nexus-launcher/desktop/scripts/release-platform.mjs'; console.log(Object.keys(targets).map(target => 'release-' + target).sort().join('\n'))")
          for run in $runs; do
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | sort)
            if [[ "$names" == "$expected" ]]; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
  build:
    needs: source
    if: needs.source.outputs.run == ''
    uses: ./.github/workflows/build.yml
  publish:
    needs: [source, build]
    if: always() && needs.source.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run || github.run_id }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Verify all packages and publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/verify-release-assets.test.mjs
          node .github/scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$(git rev-parse HEAD)"
          # Aggregate the per-architecture checksum manifests into one signed
          # download. The keyless signature binds the manifest to this exact
          # workflow running at the release tag, so users can verify artifact
          # provenance without trusting the upload itself.
          cat release-assets/*_SHA256SUMS.txt > release-assets/SHA256SUMS.txt
          cosign sign-blob --yes release-assets/SHA256SUMS.txt \
            --output-signature release-assets/SHA256SUMS.txt.sig \
            --output-certificate release-assets/SHA256SUMS.txt.crt
          cosign verify-blob release-assets/SHA256SUMS.txt \
            --signature release-assets/SHA256SUMS.txt.sig \
            --certificate release-assets/SHA256SUMS.txt.crt \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/"
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease --title "Nexus Launcher $RELEASE_TAG" \
            --notes-file .github/RELEASE_TEMPLATE.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
