name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find a complete successful build of the tagged commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p "require('./apps/nexus-launcher/package.json').version")"
          node -e "require('node:assert/strict').equal(require('./apps/nexus-launcher/src-tauri/tauri.windows.conf.json').bundle.windows.webviewInstallMode.type, 'offlineInstaller')"
          sha=$(git rev-parse HEAD)
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$sha" --status success --limit 100 --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | sort)
            expected=$(printf '%s\n' release-aarch64-apple-darwin release-aarch64-pc-windows-msvc release-i686-pc-windows-msvc release-x86_64-apple-darwin release-x86_64-pc-windows-msvc | sort)
            if [[ "$names" == "$expected" ]]; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
  build:
    needs: source
    if: needs.source.outputs.run == ''
    uses: ./.github/workflows/build.yml
  publish:
    needs: [source, build]
    if: always() && needs.source.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run || github.run_id }}
      - name: Verify all packages and publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/verify-release-assets.test.mjs
          node .github/scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$(git rev-parse HEAD)"
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease --title "Nexus Launcher $RELEASE_TAG" \
            --notes-file .github/RELEASE_TEMPLATE.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
