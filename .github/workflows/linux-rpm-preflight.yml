name: Linux RPM environment preflight

on:
  workflow_dispatch:
    inputs:
      full_business:
        description: 'Run the approved 24 GiB frozen-package business and migration acceptance'
        type: boolean
        default: false
      candidate:
        description: 'Optional reviewed1.0.4 artifact identity JSON; commit must equal this workflow checkout'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-rpm-environment-preflight
  cancel-in-progress: false

jobs:
  fedora:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      QA_TEMP: ${{ github.workspace }}/.codex-temp/linux-rpm-acceptance
      QA_EVIDENCE: ${{ github.workspace }}/.codex-artifacts/linux-rpm-acceptance
      NEXUS_QA_BUSINESS: ${{ inputs.full_business && '1' || '0' }}
      NEXUS_QA_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check approved storage envelope before downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/linux-rpm-preflight.sh capacity
      - name: Receive intact frozen QA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ fromJSON(inputs.candidate || '{"artifactId":11149572256,"runId":36834335424}').artifactId }}
          run-id: ${{ fromJSON(inputs.candidate || '{"artifactId":11149572256,"runId":36834335424}').runId }}
          github-token: ${{ github.token }}
          path: ${{ env.QA_TEMP }}/incoming
          skip-decompress: true
          digest-mismatch: error
      - name: Receive intact same-version old QA package
        if: inputs.full_business
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: '11148587625'
          run-id: '36832892260'
          github-token: ${{ github.token }}
          path: ${{ env.QA_TEMP }}/incoming-old
          skip-decompress: true
          digest-mismatch: error
      - name: Verify original ZIP, RPM and build provenance
        run: bash .github/scripts/linux-rpm-preflight.sh verify
      - name: Install original RPM and probe ordinary sandboxed GUI environment
        run: bash .github/scripts/linux-rpm-preflight.sh environment
      - name: Record owned cleanup and storage
        if: always()
        run: bash .github/scripts/linux-rpm-preflight.sh finish
      - name: Deliver small preflight evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-rpm-preflight-${{ github.run_id }}
          path: ${{ env.QA_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
